name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Web version (zip)
        run: cd game && zip -r ../out/LastRecording-Browser.zip . && cd ..
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: التسجيل الأخير ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          files: out/*
          body: |
            ## التسجيل الأخير — نزّل اللعبة
            - **ويندوز (تثبيت):** `LastRecording-Windows-Setup.exe`
            - **ويندوز (بدون تثبيت):** `LastRecording-Windows-Portable.exe`
            - **ماك:** `LastRecording-Mac.dmg` (أول مرة: كلك يمين على التطبيق ← Open)
            - **لينكس:** `LastRecording-Linux.AppImage`
            - **تشغيل من المتصفح:** `LastRecording-Browser.zip` ← فك الضغط وافتح `index.html`

            ويندوز ممكن يطلع تحذير SmartScreen لأن التطبيق غير موقّع: اضغط *More info* ثم *Run anyway*.
